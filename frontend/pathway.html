<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>学习路径 - 个性化学习助手</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <link rel="stylesheet" href="./assets/styles-v4.css">
    <style>
        .app-body { max-width: 1200px; }
        .page-subtitle { font-size: 14px; color: var(--text-3); margin-bottom: 32px; }

        /* Tabs */

        /* KG Graph Container */
        .kg-container {
            background: #fff;
            border: 1px solid var(--divider);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            min-height: 400px;
        }
        .kg-main {
            display: block;
        }
        .kg-graph-area {
            width: 100%;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background:
                /* Nebula glow - center */
                radial-gradient(ellipse at 50% 50%, rgba(100,140,200,0.10) 0%, transparent 60%),
                /* Nebula glow - offset */
                radial-gradient(ellipse at 75% 30%, rgba(150,115,190,0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 25% 70%, rgba(90,170,170,0.05) 0%, transparent 50%),
                /* Base gradient - lighter */
                linear-gradient(135deg, #1e2530 0%, #252d3a 40%, #2a3245 70%, #1e2530 100%);
            transition: background 0.3s ease;
        }
        .kg-graph-area.light-bg {
            background: linear-gradient(135deg, #FBF7F1 0%, #F4ECDF 50%, #EFE4D2 100%);
        }
        .kg-graph-area.light-bg::before {
            display: none;
        }
        .kg-graph-area::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(1px 1px at 3% 8%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 7% 35%, rgba(255,255,255,0.45) 0%, transparent 100%),
                radial-gradient(1.2px 1.2px at 10% 62%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 14% 88%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px 1px at 18% 22%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 22% 50%, rgba(255,255,255,0.65) 0%, transparent 100%),
                radial-gradient(1px 1px at 26% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 12%, rgba(255,255,255,0.55) 0%, transparent 100%),
                radial-gradient(1.2px 1.2px at 34% 42%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 38% 68%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px 1px at 42% 5%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 46% 30%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 54% 82%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1.2px 1.2px at 58% 18%, rgba(255,255,255,0.55) 0%, transparent 100%),
                radial-gradient(1px 1px at 62% 45%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 66% 72%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 70% 95%, rgba(255,255,255,0.45) 0%, transparent 100%),
                radial-gradient(1px 1px at 74% 28%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1.2px 1.2px at 78% 58%, rgba(255,255,255,0.65) 0%, transparent 100%),
                radial-gradient(1px 1px at 82% 8%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 85% 38%, rgba(255,255,255,0.55) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 88% 65%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 91% 85%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px 1px at 94% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1.2px 1.2px at 97% 48%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 12% 48%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 36% 92%, rgba(255,255,255,0.45) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 60% 3%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 84% 52%, rgba(255,255,255,0.4) 0%, transparent 100%);
        }
        .kg-detail-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 340px;
            height: 100vh;
            background: #fff;
            border-left: 1px solid var(--divider);
            box-shadow: var(--shadow-modal);
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .kg-detail-panel.open {
            transform: translateX(0);
        }
        .kg-detail-panel .panel-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: none;
            background: var(--bg-sidebar);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-3);
            transition: all 0.2s;
        }
        .kg-detail-panel .panel-close:hover { background: var(--divider); color: var(--text-1); }
        .kg-detail-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(45,35,24,0.25);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .kg-detail-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }
        .kg-detail-panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text-1); }
        .kg-detail-panel .detail-type { display: inline-block; font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
        .kg-detail-panel .detail-id { font-size: 11px; color: var(--text-3); margin-bottom: 8px; word-break: break-all; }
        .kg-detail-panel .detail-desc { font-size: 13px; color: var(--text-2); margin-bottom: 12px; line-height: 1.5; }
        .kg-detail-panel .detail-section { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 12px 0 6px; }
        .kg-detail-panel .relation-item { font-size: 12px; color: var(--text-2); padding: 4px 0; display: flex; align-items: center; gap: 4px; }
        .kg-detail-panel .resource-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #fff; border: 1px solid var(--divider); border-radius: 6px; margin-bottom: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .kg-detail-panel .resource-item:hover { border-color: var(--accent); }
        .kg-detail-panel .detail-actions { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .kg-detail-panel .detail-actions button { width: 100%; }
        .kg-placeholder {
            text-align: center;
            color: var(--text-3);
            padding: 60px 20px;
        }
        .kg-placeholder-icon { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; display: inline-flex; align-items: center; justify-content: center; }
        .kg-placeholder-text { font-size: 14px; }

        /* KG Progress Bar */
        .kg-progress-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: var(--success-soft);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--success);
        }
        .kg-progress-bar .bar { flex: 1; height: 6px; background: rgba(110,148,102,0.25); border-radius: 3px; overflow: hidden; }
        .kg-progress-bar .bar-fill { height: 100%; background: var(--success); border-radius: 3px; }

        /* Type filter checkboxes */
        .type-filter-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .type-filter-group label { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 4px; background: var(--accent-soft); border: 1px solid var(--divider); transition: all 0.2s; }
        .type-filter-group label:hover { border-color: var(--accent); }
        .type-filter-group input[type="checkbox"] { width: 14px; height: 14px; }

        /* Pathway select in detail panel */
        .pathway-select-list { max-height: 150px; overflow-y: auto; border: 1px solid var(--divider); border-radius: 12px; margin-top: 6px; }
        .pathway-select-item { padding: 8px 12px; font-size: 12px; cursor: pointer; transition: background 0.2s; }
        .pathway-select-item:hover { background: var(--accent-soft); }

        /* KG Filter Bar */
        .kg-filter {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-select {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
            outline: none;
            min-width: 120px;
        }

        /* ===== 学习路径 Tab 改版：路线图样式 ===== */

        /* 路径切换器 */
        .pathway-tabs {
            flex-wrap: wrap; align-items: center;
        }
        .pathway-tab-more {
            position: relative;
        }
        .pathway-tab-more-menu {
            display: none;
            position: absolute;
            top: 100%; left: 0;
            background: #fff;
            border: 1px solid var(--divider);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            z-index: 10;
            min-width: 160px;
            padding: 4px 0;
        }
        .pathway-tab-more-menu .pathway-tab-sub {
            display: block;
            width: 100%;
            padding: 8px 16px;
            font-size: 14px;
            color: var(--text-1);
            background: none; border: none;
            cursor: pointer;
            text-align: left;
        }
        .pathway-tab-sub:hover { background: var(--accent-soft); }
        .pathway-tab-add {
            margin-left: auto;
            padding: 6px 14px;
            font-size: 13px; font-weight: 500;
            color: var(--accent);
            background: transparent;
            border: 1px dashed var(--accent);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .pathway-tab-add:hover { background: var(--accent-soft); }

        /* 路线卡片 */
        .roadmap-card {
            background: var(--glass, rgba(255,255,255,0.50));
            backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid var(--border-glass, rgba(255,255,255,0.30));
            border-radius: var(--r-lg, 16px);
            padding: 24px;
            box-shadow: var(--shadow-glass, 0 4px 20px rgba(120,84,44,0.06));
            margin-bottom: 24px;
        }
        .roadmap-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .roadmap-title {
            font-family: var(--display, 'DM Serif Display', 'Noto Serif SC', serif);
            font-size: 20px; font-weight: 700;
            color: var(--text-1);
        }
        .roadmap-meta {
            font-size: 12px; color: var(--text-3);
            margin-top: 4px;
        }
        .roadmap-actions-header {
            display: flex; gap: 8px; align-items: center;
        }

        /* 节点进度尺 */
        .progress-stepper {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 16px 0 20px;
            overflow-x: auto;
        }
        .progress-node {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 600;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
        }
        .progress-node:hover { transform: scale(1.25); }
        .progress-node.done { background: var(--success); color: #fff; }
        .progress-node.current {
            background: var(--warning); color: #fff;
            animation: pulse-subtle 2.5s ease-in-out infinite;
        }
        .progress-node.pending { background: var(--divider); color: var(--text-3); }
        .progress-connector {
            width: 36px; height: 3px;
            flex-shrink: 0;
            border-radius: 2px;
        }
        .progress-connector.done { background: var(--success); }
        .progress-connector.pending { background: var(--divider); }

        /* 知识点行 */
        .step-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: var(--r-md, 10px);
            background: var(--glass, rgba(255,255,255,0.50));
            border: 1px solid transparent;
            transition: all 0.2s ease;
            min-height: 72px;
            cursor: default;
        }
        .step-row + .step-row { margin-top: 8px; }
        .step-row:hover {
            border-color: var(--border-glass, rgba(255,255,255,0.30));
            box-shadow: 0 2px 12px rgba(120,84,44,0.08);
        }
        .step-row.dragging {
            opacity: 0.4;
            box-shadow: 0 8px 24px rgba(120,84,44,0.16);
            border-color: var(--accent);
        }
        .step-row.drag-over {
            border-color: var(--accent);
            border-style: dashed;
            box-shadow: 0 0 0 2px rgba(199,123,60,0.15);
        }
        .step-row.completed { border-left: 0; }
        .step-row.in-progress { background: rgba(201,138,46,0.06); }
        .step-row.pending {}

        /* 序号圆点 */
        .step-indicator {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .step-indicator.done { background: var(--success); color: #fff; }
        .step-indicator.current { background: var(--warning); color: #fff; animation: pulse-subtle 2.5s ease-in-out infinite; }
        .step-indicator.pending { background: var(--divider); color: var(--text-3); }

        /* 步骤内容 */
        .step-body { flex: 1; min-width: 0; }
        .step-name { font-size: 14px; font-weight: 600; color: var(--text-1); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .step-name:hover { color: var(--accent); }
        .step-score { font-size: 12px; font-weight: 500; padding: 1px 6px; border-radius: 4px; }
        .step-score.mastered { background: var(--success-soft); color: var(--success); }
        .step-score.learning { background: var(--warning-soft); color: var(--warning); }
        .step-score.none { background: rgba(188,174,156,0.12); color: var(--text-3); }
        .step-summary {
            font-size: 12px; color: var(--text-3);
            margin-top: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* 步骤操作按钮 */
        .step-actions {
            display: flex; align-items: center; gap: 4px;
            flex-shrink: 0;
            opacity: 0.4; transition: opacity 0.2s;
        }
        .step-row:hover .step-actions { opacity: 1; }
        .step-action-btn {
            width: 32px; height: 32px;
            border: none; background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-2);
            transition: all 0.15s;
        }
        .step-action-btn:hover { background: var(--accent-soft); color: var(--accent); }
        .step-action-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
        .step-action-btn.drag-handle { cursor: grab; }
        .step-action-btn.drag-handle:active { cursor: grabbing; }

        /* 展开详情 */
        .step-expand {
            display: none;
            margin-top: 8px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.50);
            border: 1px solid var(--divider);
            border-radius: var(--r-md, 10px);
            font-size: 13px; color: var(--text-2);
            max-height: 150px; overflow-y: auto;
        }
        .step-row.expanded .step-expand { display: block; }
        .step-expand-section { margin-bottom: 8px; }
        .step-expand-label { font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
        .step-expand-link {
            color: var(--accent); cursor: pointer;
            margin-right: 12px; font-size: 12px;
        }
        .step-expand-link:hover { text-decoration: underline; }

        /* 空路线图 */
        .roadmap-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
        }
        .roadmap-empty-icon {
            width: 64px; height: 64px;
            margin: 0 auto 16px;
            opacity: 0.4;
            display: flex; align-items: center; justify-content: center;
        }
        .roadmap-empty-title { font-size: 16px; font-weight: 600; color: var(--text-1); margin-bottom: 8px; }
        .roadmap-empty-desc { font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
        .roadmap-empty-actions { display: flex; gap: 12px; justify-content: center; }

        /* 创建路径对话框 */
        .pathway-dialog-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 100;
            align-items: center; justify-content: center;
        }
        .pathway-dialog-overlay.open { display: flex; }
        .pathway-dialog {
            background: #fff;
            border-radius: var(--r-lg, 16px);
            padding: 24px;
            width: min(420px, 92vw);
            box-shadow: 0 14px 40px rgba(120,84,44,0.18);
        }
        .pathway-dialog h3 {
            font-size: 17px; font-weight: 600;
            color: var(--text-1);
            margin-bottom: 12px;
        }
        .pathway-dialog .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }
        .pathway-dialog .form-input:focus { border-color: var(--accent); }
        .pathway-dialog .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

        /* 页面特有按钮 */
        .btn-delete {
            padding: 6px 12px;
            background: #fff;
            color: var(--danger);
            border: 1px solid rgba(201,96,90,0.30);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* 脉冲动画 */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ===== KG 知识点列表改版：紧凑数据表 ===== */
        .kg-node-list {
            margin-top: 16px;
            background: var(--glass, rgba(255,255,255,0.50));
            backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid var(--border-glass, rgba(255,255,255,0.30));
            border-radius: var(--r-lg, 16px);
            box-shadow: var(--shadow-glass, 0 4px 20px rgba(120,84,44,0.06));
            overflow: hidden;
        }
        .kg-node-section {
            border-bottom: 1px solid var(--divider);
        }
        .kg-node-section:last-child { border-bottom: none; }
        .kg-node-section-header {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.40);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .kg-node-section-header:hover { background: rgba(255,255,255,0.60); }
        .kg-node-section-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .kg-node-section-label {
            font-size: 13px; font-weight: 600;
            color: var(--text-1);
        }
        .kg-node-section-count {
            font-size: 12px; color: var(--text-3);
            margin-left: auto;
        }
        .kg-node-section-arrow {
            width: 16px; height: 16px;
            color: var(--text-3);
            transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .kg-node-section.collapsed .kg-node-section-arrow {
            transform: rotate(-90deg);
        }
        .kg-node-rows {
            max-height: 2000px;
            opacity: 1;
            padding: 0 20px 8px;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.35s ease;
        }
        .kg-node-section.collapsed .kg-node-rows {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }
        .kg-node-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 42px;
        }
        .kg-node-row:hover { background: rgba(199,123,60,0.06); }
        .kg-node-row.learned { background: rgba(110,148,102,0.06); }
        .kg-node-row.learned:hover { background: rgba(110,148,102,0.10); }
        .kg-node-row-indicator {
            width: 20px; height: 20px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .kg-node-row-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .kg-node-row-name {
            flex: 1; min-width: 0;
            font-size: 13px; font-weight: 500;
            color: var(--text-1);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .kg-node-row.learned .kg-node-row-name { color: var(--text-1); }
        .kg-node-row-meta {
            font-size: 11px; color: var(--text-4);
            flex-shrink: 0;
            font-family: var(--mono, monospace);
        }
        .kg-node-row-actions {
            display: flex; gap: 2px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .kg-node-row:hover .kg-node-row-actions { opacity: 1; }

<body>

    <div class="app-layout">

                        <div class="roadmap-empty-actions">

    <!-- Slide-in Detail Panel (outside main layout) -->
    <div class="kg-detail-backdrop" id="kg-detail-backdrop" onclick="window._closeDetailPanel()"></div>
    <div class="kg-detail-panel" id="kg-detail-panel">
        <button class="panel-close" onclick="window._closeDetailPanel()">✕</button>
        <div style="text-align:center;color:var(--text-3);padding:40px 10px;font-size:13px;">
            点击图中节点查看详情
        </div>
