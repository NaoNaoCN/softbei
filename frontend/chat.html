<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能对话 - 个性化学习助手</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #F5F7FA;
            color: #1A1A2E;
            height: 100vh;
            overflow: hidden;
        }
        .layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: static; /* override fixed from styles.css — chat uses flex layout */
            width: 240px;
            background: #EEF4FB;
            border-right: 1px solid #E0E6ED;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-logo {
            font-size: 18px;
            font-weight: 700;
            color: #1976D2;
            margin-bottom: 24px;
            padding-left: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 8px;
            color: #1A1A2E;
            text-decoration: none;
            margin-bottom: 4px;
            transition: all 0.2s;
            font-size: 14px;
        }
        .nav-item:hover { background: #E3F2FD; color: #1976D2; }
        .nav-item.active { background: #1976D2; color: #fff; }
        .nav-item .icon { width: 24px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Chat Header */
        .chat-header {
            padding: 20px 32px;
            border-bottom: 1px solid #E0E6ED;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header-title {
            font-size: 18px;
            font-weight: 600;
            color: #1A1A2E;
        }
        .chat-header-sub {
            font-size: 13px;
            color: #6B7280;
            margin-top: 2px;
        }

        /* Onboarding Banner */
        .onboarding-banner {
            padding: 12px 32px;
            background: #E3F2FD;
            border-bottom: 1px solid #E0E6ED;
            font-size: 14px;
            color: #1565C0;
        }

        /* Session Sidebar */
        .session-panel {
            width: 260px;
            border-right: 1px solid #E0E6ED;
            background: #F5F7FA;
            display: flex;
            flex-direction: column;
        }
        .session-header {
            padding: 16px;
            border-bottom: 1px solid #E0E6ED;
        }
        .btn-new-chat {
            width: 100%;
            padding: 10px;
            background: #1976D2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-new-chat:hover { background: #1565C0; }
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .session-label {
            font-size: 12px;
            color: #6B7280;
            padding: 8px 8px 4px;
            font-weight: 500;
        }
        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.2s;
        }
        .session-item:hover { background: #E3F2FD; }
        .session-item.active { background: #1976D2; color: #fff; }
        .session-title {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }
        .session-delete {
            opacity: 0;
            font-size: 12px;
            color: #E53935;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .session-item:hover .session-delete { opacity: 1; }
        .session-item.active .session-delete { color: #fff; }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }
        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }
        .message.user .message-bubble {
            background: #1976D2;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .message-bubble {
            background: #fff;
            border: 1px solid #E0E6ED;
            border-bottom-left-radius: 4px;
        }
        .message-time {
            font-size: 11px;
            color: #9CA3AF;
            padding: 0 4px;
        }
        .message.user .message-time { text-align: right; }

        /* Markdown rendering in assistant messages */
        .message.assistant .message-bubble h1,
        .message.assistant .message-bubble h2,
        .message.assistant .message-bubble h3 { margin: 12px 0 6px; font-size: 1.1em; }
        .message.assistant .message-bubble h1 { font-size: 1.3em; }
        .message.assistant .message-bubble p { margin: 6px 0; }
        .message.assistant .message-bubble ul,
        .message.assistant .message-bubble ol { padding-left: 20px; margin: 6px 0; }
        .message.assistant .message-bubble pre {
            background: #f6f8fa; border-radius: 6px; padding: 10px;
            overflow-x: auto; margin: 8px 0; font-size: 13px;
        }
        .message.assistant .message-bubble code {
            font-family: 'Fira Code', Consolas, monospace; font-size: 13px;
        }
        .message.assistant .message-bubble :not(pre) > code {
            background: #f0f0f0; padding: 2px 5px; border-radius: 3px;
        }
        .message.assistant .message-bubble blockquote {
            border-left: 3px solid #1976D2; padding-left: 10px; color: #555; margin: 8px 0;
        }
        .message.assistant .message-bubble table {
            border-collapse: collapse; margin: 8px 0; font-size: 13px;
        }
        .message.assistant .message-bubble th,
        .message.assistant .message-bubble td {
            border: 1px solid #ddd; padding: 6px 10px;
        }
        .message.assistant .message-bubble th { background: #f6f8fa; }

        /* AI Recommendations */
        .recommendations-panel {
            margin: 16px 0;
            padding: 16px;
            background: #fff;
            border: 1px solid #E0E6ED;
            border-radius: 12px;
        }
        .recommendations-title {
            font-size: 14px;
            font-weight: 600;
            color: #1A1A2E;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rec-close {
            margin-left: auto;
            cursor: pointer;
            font-size: 20px;
            color: #999;
            line-height: 1;
            padding: 0 4px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }
        .rec-close:hover {
            color: #333;
            background: #f0f0f0;
        }
        .recommendation-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #F0F0F0;
        }
        .recommendation-item:last-child { border-bottom: none; }
        .rec-info { flex: 1; }
        .rec-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .rec-reason { font-size: 12px; color: #6B7280; }
        .btn-rec {
            padding: 6px 16px;
            background: #E3F2FD;
            color: #1976D2;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-rec:hover { background: #1976D2; color: #fff; }
        .btn-save-pathway {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            background: #fff;
            color: #1976D2;
            border: 1px solid #1976D2;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-save-pathway:hover { background: #1976D2; color: #fff; }

        /* Input Area */
        .input-area {
            padding: 16px 32px;
            border-top: 1px solid #E0E6ED;
            background: #fff;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #E0E6ED;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .chat-input:focus { border-color: #1976D2; box-shadow: 0 0 0 3px rgba(25,118,210,0.1); }
        .chat-send {
            width: 48px;
            height: 48px;
            background: #1976D2;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-send:hover { background: #1565C0; }

        /* Chat Container Layout */
        .chat-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-logo">个性化学习助手</div>
                <a href="index.html" class="nav-item"><span class="icon"><i data-lucide="home"></i></span><span>首页</span></a>
                <a href="chat.html" class="nav-item active"><span class="icon"><i data-lucide="message-circle"></i></span><span>智能对话</span></a>
                <a href="profile.html" class="nav-item"><span class="icon"><i data-lucide="user"></i></span><span>我的画像</span></a>
                <a href="generate.html" class="nav-item"><span class="icon"><i data-lucide="sparkles"></i></span><span>生成资源</span></a>
                <a href="pathway.html" class="nav-item"><span class="icon"><i data-lucide="map"></i></span><span>学习路径</span></a>
                <a href="library.html" class="nav-item"><span class="icon"><i data-lucide="book-open"></i></span><span>资源库</span></a>
                <a href="evaluate.html" class="nav-item"><span class="icon"><i data-lucide="clipboard-check"></i></span><span>学习评估</span></a>
        </nav>

        <!-- Chat Container -->
        <div class="chat-area">
            <!-- Header -->
            <div class="chat-header">
                <div>
                    <div class="chat-header-title">智能对话</div>
                    <div class="chat-header-sub">描述您的学习需求，AI 将自动生成相应资源</div>
                </div>
            </div>

            <!-- Onboarding Banner (show when applicable) -->
            <div class="onboarding-banner">
                正在了解你的学习情况，请回答几个问题帮助我为你定制学习方案。
            </div>

            <!-- Chat Main -->
            <div class="chat-container">
                <!-- Session Panel -->
                <div class="session-panel">
                    <div class="session-header">
                        <button class="btn-new-chat">+ 新建会话</button>
                    </div>
                    <div class="session-list" id="session-list">
                        <div class="session-label">历史会话</div>
                        <div id="sessions-container"></div>
                    </div>
                </div>

                <!-- Messages -->
                <div class="chat-main">
                    <div class="messages-area" id="messages-area"></div>

                    <!-- Input Area -->
                    <div class="input-area">
                        <input type="text" class="chat-input" id="chat-input" placeholder="输入消息..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="chat-send" onclick="sendMessage()">&#9654;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { isLoggedIn, getUserId, getChatSessions, createChatSession, getChatMessages, sendChatMessage, deleteChatSession, updateSessionTitle, createPathway, addPathwayItem, getBatchStatus } from './assets/api.js';
        
        if (!isLoggedIn()) {
            window.location.href = 'auth.html';
        }

        const userId = getUserId();
        let activeSessionId = null;
        let sessions = [];

        // ---- marked.js + highlight.js 配置 ----
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true,
                gfm: true
            });
        }

        function renderMarkdown(text, videoRefs) {
            if (!text || typeof marked === 'undefined') return escapeHtml(text || '');
            try {
                const mathPlaceholders = [];
                // 保护 $$...$$ 块级公式
                let processed = text.replace(/\$\$([\s\S]*?)\$\$/g, (m) => {
                    mathPlaceholders.push(m);
                    return `\x00MATH${mathPlaceholders.length - 1}\x00`;
                });
                // 保护 $...$ 行内公式
                processed = processed.replace(/(?<!\$)\$(?!\$)(.+?)(?<!\$)\$(?!\$)/g, (m) => {
                    mathPlaceholders.push(m);
                    return `\x00MATH${mathPlaceholders.length - 1}\x00`;
                });
                let html = marked.parse(processed);
                html = html.replace(/\x00MATH(\d+)\x00/g, (_, idx) => mathPlaceholders[parseInt(idx)]);
                // 渲染 [v1] [v2] 视频引用为上标链接
                if (videoRefs && videoRefs.length) {
                    html = html.replace(/\[v(\d+)\]/g, (_, n) => {
                        const idx = parseInt(n) - 1;
                        const video = videoRefs[idx];
                        if (!video) return `[v${n}]`;
                        return `<sup><a href="${video.url}" target="_blank" class="video-cite" title="${video.title}">[v${n}]</a></sup>`;
                    });
                }
                return html;
            } catch (e) {
                return escapeHtml(text);
            }
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderVideoCards(videoRefs) {
            if (!videoRefs || !videoRefs.length) return '';
            return `<div class="video-cards">${videoRefs.map((v, i) => `
                <a href="${v.url}" target="_blank" class="video-card">
                    <div class="video-card-cover">
                        ${v.thumbnail ? `<img src="${v.thumbnail}" referrerpolicy="no-referrer" onerror="this.parentElement.classList.add('no-img')" alt=""/>` : ''}
                        <span class="video-card-duration">${v.duration || ''}</span>
                        <span class="video-cite-badge">v${i+1}</span>
                    </div>
                    <div class="video-card-info">
                        <span class="video-card-title">${escapeHtml(v.title)}</span>
                        <span class="video-card-meta"><span class="video-card-source">${v.source === 'bilibili' ? 'B站' : v.source}</span></span>
                    </div>
                </a>`).join('')}
            </div>`;
        }

        function formatTime(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function renderSessions() {
            const container = document.getElementById('sessions-container');
            if (!sessions.length) {
                container.innerHTML = '<div style="padding:12px 8px;font-size:13px;color:#6B7280;">暂无会话记录</div>';
                return;
            }
            container.innerHTML = sessions.map(s => `
                <div class="session-item ${s.id === activeSessionId ? 'active' : ''}" data-sid="${s.id}">
                    <span class="session-title">${escapeHtml(s.title || '新会话')}</span>
                    <button class="session-delete">删除</button>
                </div>
            `).join('');

            // 事件委托
            container.querySelectorAll('.session-item').forEach(item => {
                const sid = item.dataset.sid;
                const titleEl = item.querySelector('.session-title');
                const delBtn = item.querySelector('.session-delete');

                item.addEventListener('click', () => loadSession(sid));
                delBtn.addEventListener('click', (e) => { e.stopPropagation(); handleDeleteSession(sid); });
                titleEl.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    handleRename(sid, titleEl);
                });
            });
        }

        let renaming = false;
        function handleRename(sessionId, el) {
            if (renaming) return;
            renaming = true;
            const oldTitle = el.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldTitle === '新会话' ? '' : oldTitle;
            input.style.cssText = 'width:100%;font-size:13px;padding:2px 4px;border:1px solid #1976D2;border-radius:4px;outline:none;background:#fff;color:#1A1A2E;';
            el.replaceWith(input);
            input.focus();
            input.select();

            let committed = false;
            async function commit() {
                if (committed) return;
                committed = true;
                const newTitle = input.value.trim();
                if (newTitle && newTitle !== oldTitle) {
                    await updateSessionTitle(sessionId, userId, newTitle);
                    const s = sessions.find(x => x.id === sessionId);
                    if (s) s.title = newTitle;
                }
                renaming = false;
                renderSessions();
            }
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { input.value = oldTitle; input.blur(); }
            });
        }

        function renderMessages(messages) {
            const area = document.getElementById('messages-area');
            if (!messages || !messages.length) {
                area.innerHTML = '<div style="padding:40px;text-align:center;color:#6B7280;font-size:14px;">发送消息开始对话</div>';
                return;
            }
            const parts = [];
            for (const m of messages) {
                const content = m.role === 'assistant' ? renderMarkdown(m.content) : escapeHtml(m.content);
                parts.push(`
                <div class="message ${m.role}">
                    <div class="message-bubble">${content}</div>
                    <div class="message-time">${formatTime(m.created_at)}</div>
                </div>`);
                // 在 assistant 消息后插入持久化的视频卡片
                if (m.role === 'assistant' && m.extra && m.extra.video_refs && m.extra.video_refs.length) {
                    parts.push(renderVideoCards(m.extra.video_refs));
                }
            }
            area.innerHTML = parts.join('');
            // 渲染 LaTeX 公式
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(area, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\[', right: '\\]', display: true },
                        { left: '\\(', right: '\\)', display: false }
                    ],
                    throwOnError: false
                });
            }
            area.scrollTop = area.scrollHeight;
        }

        function renderRecommendations(metadata) {
            // 移除旧的推荐面板
            const old = document.getElementById('rec-panel');
            if (old) old.remove();

            const recs = metadata && metadata.recommendations;
            if (!recs || !recs.length) return;

            const area = document.getElementById('messages-area');
            const panel = document.createElement('div');
            panel.id = 'rec-panel';
            panel.className = 'recommendations-panel';
            panel.innerHTML = `
                <div class="recommendations-title">
                    <i data-lucide="compass" style="width:16px;height:16px;"></i>
                    推荐学习路线
                    <span class="rec-close" onclick="this.closest('.recommendations-panel').remove()" title="关闭">&times;</span>
                </div>
                ${recs.map((r, i) => `
                    <div class="recommendation-item">
                        <div class="rec-info">
                            <div class="rec-name">${escapeHtml(r.kp_name || r.name || '未知知识点')}</div>
                            <div class="rec-reason">${escapeHtml(r.reason || '')}</div>
                        </div>
                        <button class="btn-rec" onclick="window.open('generate.html?kp_id=${encodeURIComponent(r.kp_id || '')}','_blank')">去学习</button>
                    </div>
                `).join('')}
                <button class="btn-save-pathway" onclick="handleSavePathway()">保存为学习路径</button>
            `;
            panel.dataset.recs = JSON.stringify(recs);
            area.appendChild(panel);
            area.scrollTop = area.scrollHeight;
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        async function handleSavePathway() {
            const panel = document.getElementById('rec-panel');
            if (!panel) return;
            const recs = JSON.parse(panel.dataset.recs || '[]');
            if (!recs.length) return;
            try {
                const path = await createPathway(userId, '智能推荐路径');
                if (path && path.id) {
                    for (let i = 0; i < recs.length; i++) {
                        if (recs[i].kp_id) {
                            await addPathwayItem(path.id, userId, recs[i].kp_id, i);
                        }
                    }
                    alert('已保存为学习路径，可在「学习路径」页面查看');
                }
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
        }
        window.handleSavePathway = handleSavePathway;

        const RESOURCE_TYPE_LABELS = { doc: '学习文档', mindmap: '思维导图', quiz: '测验题目', code: '代码示例', summary: '知识总结' };

        function renderBatchProgressCard(batchId) {
            const area = document.getElementById('messages-area');
            const card = document.createElement('div');
            card.id = `batch-card-${batchId}`;
            card.className = 'message assistant';
            card.innerHTML = `
                <div class="message-bubble" style="background:#F0F9FF;border:1px solid #BAE6FD;padding:16px;">
                    <div style="font-weight:600;margin-bottom:8px;color:#0369A1;">
                        <span style="margin-right:6px;">⚡</span>正在为您生成额外资源...
                    </div>
                    <div class="batch-tasks" style="display:flex;flex-direction:column;gap:8px;"></div>
                </div>`;
            area.appendChild(card);
            area.scrollTop = area.scrollHeight;
            pollBatchStatus(batchId);
        }

        async function pollBatchStatus(batchId) {
            const card = document.getElementById(`batch-card-${batchId}`);
            if (!card) return;
            try {
                const status = await getBatchStatus(batchId);
                if (!status) return;
                const tasksDiv = card.querySelector('.batch-tasks');
                tasksDiv.innerHTML = status.tasks.map(t => {
                    const label = RESOURCE_TYPE_LABELS[t.resource_type] || t.resource_type;
                    const isDone = t.status === 'done';
                    const isFailed = t.status === 'failed';
                    const icon = isDone ? '✅' : isFailed ? '❌' : '⏳';
                    const barColor = isDone ? '#10B981' : isFailed ? '#EF4444' : '#3B82F6';
                    return `<div style="display:flex;align-items:center;gap:8px;">
                        <span>${icon}</span>
                        <span style="min-width:70px;font-size:13px;">${label}</span>
                        <div style="flex:1;height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden;">
                            <div style="width:${t.progress}%;height:100%;background:${barColor};transition:width 0.3s;"></div>
                        </div>
                        <span style="font-size:12px;color:#6B7280;">${t.progress}%</span>
                    </div>`;
                }).join('');
                if (status.status === 'done' || status.status === 'failed') {
                    const header = card.querySelector('div[style*="font-weight"]');
                    if (status.status === 'done') {
                        header.innerHTML = '<span style="margin-right:6px;">✅</span>额外资源生成完成';
                        const links = status.tasks.filter(t => t.result_id).map(t => {
                            const label = RESOURCE_TYPE_LABELS[t.resource_type] || t.resource_type;
                            return `<a href="library.html" style="color:#2563EB;text-decoration:underline;font-size:13px;">${label}</a>`;
                        }).join('&nbsp;&nbsp;|&nbsp;&nbsp;');
                        if (links) {
                            tasksDiv.innerHTML += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #E5E7EB;">前往资源库查看：${links}</div>`;
                        }
                    } else {
                        header.innerHTML = '<span style="margin-right:6px;">⚠️</span>部分资源生成失败';
                    }
                    return;
                }
            } catch (e) {
                console.error('pollBatchStatus error:', e);
            }
            setTimeout(() => pollBatchStatus(batchId), 2000);
        }

        async function loadSessions() {
            sessions = await getChatSessions(userId) || [];
            renderSessions();
        }

        async function loadSession(sessionId) {
            activeSessionId = sessionId;
            renderSessions();
            const messages = await getChatMessages(sessionId, userId);
            renderMessages(messages);
        }

        async function handleNewChat() {
            try {
                const session = await createChatSession(userId);
                if (session && session.id) {
                    activeSessionId = session.id;
                    await loadSessions();
                    await loadSession(session.id);
                }
            } catch (err) {
                console.error('handleNewChat error:', err);
            }
        }

        async function sendMessage() {
            try {
                const input = document.getElementById('chat-input');
                const content = input.value.trim();
                if (!content) return;

                // Auto-create session if none is active
                if (!activeSessionId) {
                    await handleNewChat();
                    await new Promise(resolve => setTimeout(resolve, 200));
                    if (!activeSessionId) return;
                }

                // Append user message immediately
                const area = document.getElementById('messages-area');
                area.innerHTML += `
                    <div class="message user">
                        <div class="message-bubble">${escapeHtml(content)}</div>
                        <div class="message-time">${formatTime(new Date().toISOString())}</div>
                    </div>
                    <div class="message assistant" id="thinking-msg">
                        <div class="message-bubble" style="color:#6B7280;">🤔 AI 正在思考...</div>
                    </div>
                `;
                input.value = '';
                area.scrollTop = area.scrollHeight;

                // Disable send button while waiting
                const sendBtn = document.querySelector('.chat-send');
                sendBtn.disabled = true;

                // Send to backend (non-streaming for simplicity)
                try {
                    const response = await sendChatMessage(activeSessionId, userId, content);
                    // Remove thinking indicator
                    const thinking = document.getElementById('thinking-msg');
                    if (thinking) thinking.remove();
                    sendBtn.disabled = false;
                    if (response && response.content) {
                        await loadSession(activeSessionId);
                    }
                    // 渲染推荐学习路线
                    if (response && response.metadata) {
                        // 渲染视频引用卡片（在文档后、推荐路径前）
                        if (response.metadata.video_refs && response.metadata.video_refs.length) {
                            const area = document.getElementById('messages-area');
                            const allAssistant = area.querySelectorAll('.message.assistant');
                            const lastMsg = allAssistant[allAssistant.length - 1];
                            if (lastMsg) {
                                lastMsg.insertAdjacentHTML('afterend', renderVideoCards(response.metadata.video_refs));
                            }
                        }
                        renderRecommendations(response.metadata);
                        // 检测批量生成，显示进度卡片
                        if (response.metadata.batch_id) {
                            renderBatchProgressCard(response.metadata.batch_id);
                        }
                    }
                    // 延迟刷新会话列表，等待后台自动命名完成
                    setTimeout(() => loadSessions(), 3000);
                } catch (err) {
                    const thinking = document.getElementById('thinking-msg');
                    if (thinking) thinking.remove();
                    sendBtn.disabled = false;
                    console.error('sendMessage error:', err);
                    alert('发送失败: ' + err.message);
                }
            } catch (err) {
                console.error('sendMessage error:', err);
                alert('发送失败: ' + err.message);
            }
        }

        async function handleDeleteSession(sessionId) {
            if (!confirm('确定删除该会话？')) return;
            await deleteChatSession(sessionId, userId);
            if (activeSessionId === sessionId) {
                activeSessionId = null;
                document.getElementById('messages-area').innerHTML = '<div style="padding:40px;text-align:center;color:#6B7280;font-size:14px;">发送消息开始对话</div>';
            }
            await loadSessions();
        }

        window.loadSession = loadSession;
        window.sendMessage = sendMessage;
        window.handleDeleteSession = handleDeleteSession;
        window.handleNewChat = handleNewChat;

        document.querySelector('.btn-new-chat').addEventListener('click', handleNewChat);

        loadSessions();
    </script>
    <script>lucide.createIcons();</script>
    <script src="./assets/tracker.js"></script>
</body>
</html>
