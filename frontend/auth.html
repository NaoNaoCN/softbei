<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - 个性化学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F7F8FC;
            color: #1E1E2E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo h1 {
            font-size: 24px;
            color: #4F6EF7;
            font-weight: 700;
        }
        .auth-logo p {
            font-size: 14px;
            color: #4B5563;
            margin-top: 8px;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #E5E7EB;
            margin-bottom: 24px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: #4B5563;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab:hover { color: #4F6EF7; }
        .tab.active {
            color: #4F6EF7;
            border-bottom-color: #4F6EF7;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: #4F6EF7;
            box-shadow: 0 0 0 3px rgba(25,118,210,0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #4F6EF7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #3B55D9; }
        .btn-primary:disabled { background: #BDBDBD; cursor: not-allowed; }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .alert-success {
            background: #E8F5E9;
            border-left: 4px solid #10B981;
            color: #2E7D32;
        }
        .alert-danger {
            background: #FFEBEE;
            border-left: 4px solid #EF4444;
            color: #C62828;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <div style="width:50px;height:50px;margin:0 auto 16px;border-radius:14px;background:var(--color-primary-gradient, linear-gradient(135deg,#4F6EF7,#7C5CFC));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;">S</div>
            <h1>个性化学习助手</h1>
            <p>登录后享受更多功能</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
            <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
        </div>

        <div id="login-form">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" id="login-username" class="form-input" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="login-password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button class="btn-primary" id="login-btn" onclick="handleLogin()">登录</button>
        </div>

        <div id="register-form" style="display:none;">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" id="reg-username" class="form-input" placeholder="请输入用户名（3-20字符）" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="reg-password" class="form-input" placeholder="请输入密码（至少6字符）" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label">确认密码</label>
                <input type="password" id="reg-password-confirm" class="form-input" placeholder="请再次输入密码" autocomplete="new-password">
            </div>
            <button class="btn-primary" id="register-btn" onclick="handleRegister()">注册</button>
        </div>
    </div>

    <script type="module">
        import { authLogin, authRegister, isLoggedIn } from './assets/api.js';

        // 如果已登录，直接跳转首页
        if (isLoggedIn()) {
            window.location.href = 'index.html';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
            hideAlert();
        }

        function showAlert(message, type = 'danger') {
            const box = document.getElementById('alert-box');
            box.className = `alert alert-${type}`;
            box.textContent = message;
            box.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alert-box').style.display = 'none';
        }

        function setLoading(btn, loading) {
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<span class="spinner"></span>处理中...'
                : (btn.id === 'login-btn' ? '登录' : '注册');
        }

        async function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            if (!username || !password) {
                showAlert('请填写用户名和密码');
                return;
            }

            setLoading(btn, true);
            try {
                const result = await authLogin(username, password);
                if (result && result.user_id) {
                    sessionStorage.removeItem('softbei_daily_shown');
                    window.location.href = 'index.html';
                } else {
                    showAlert('登录失败，请检查用户名和密码');
                }
            } catch (e) {
                showAlert('网络异常，请稍后重试');
            } finally {
                setLoading(btn, false);
            }
        }

        async function handleRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password-confirm').value;
            const btn = document.getElementById('register-btn');

            if (!username || !password) {
                showAlert('请填写用户名和密码');
                return;
            }
            if (username.length < 3 || username.length > 20) {
                showAlert('用户名需为 3-20 个字符');
                return;
            }
            if (password.length < 6) {
                showAlert('密码至少需要 6 个字符');
                return;
            }
            if (password !== passwordConfirm) {
                showAlert('两次输入的密码不一致');
                return;
            }

            setLoading(btn, true);
            try {
                const resp = await authRegister(username, password);
                if (resp && resp.id) {
                    showAlert('注册成功！请登录。', 'success');
                    switchTab('login');
                    document.getElementById('login-username').value = username;
                    document.getElementById('login-password').value = '';
                    document.getElementById('reg-password').value = '';
                    document.getElementById('reg-password-confirm').value = '';
                } else {
                    const errMsg = resp?.detail || '注册失败';
                    showAlert(errMsg);
                }
            } catch (e) {
                showAlert('网络异常，请稍后重试');
            } finally {
                setLoading(btn, false);
            }
        }

        // 回车键提交
        document.getElementById('login-password').addEventListener('keypress', e => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('reg-password-confirm').addEventListener('keypress', e => {
            if (e.key === 'Enter') handleRegister();
        });

        // 暴露到全局，供 HTML onclick 调用
        window.switchTab = switchTab;
        window.handleLogin = handleLogin;
        window.handleRegister = handleRegister;
    </script>
</body>
</html>
