<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成资源 - 个性化学习助手</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./assets/styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #F5F7FA;
            color: #1A1A2E;
            min-height: 100vh;
        }
        .layout {
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #EEF4FB;
            border-right: 1px solid #E0E6ED;
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-logo {
            font-size: 18px;
            font-weight: 700;
            color: #1976D2;
            margin-bottom: 24px;
            padding-left: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 8px;
            color: #1A1A2E;
            text-decoration: none;
            margin-bottom: 4px;
            transition: all 0.2s;
            font-size: 14px;
        }
        .nav-item:hover { background: #E3F2FD; color: #1976D2; }
        .nav-item.active { background: #1976D2; color: #fff; }
        .nav-item .icon { width: 24px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* Main */
        .main {
            margin-left: 240px;
            padding: 32px 40px;
            flex: 1;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #1976D2;
            margin-bottom: 8px;
            padding-bottom: 12px;
            border-bottom: 3px solid #1976D2;
        }
        .page-subtitle {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 32px;

        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
        }
        .mode-tab {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #E0E6ED;
            background: #fff;
            color: #6B7280;
            transition: all 0.2s;
        }
        .mode-tab:hover { border-color: #1976D2; color: #1976D2; }
        .mode-tab.active {

            color: #fff;

        }

        .content-grid {
            display: grid;

    <script type="module">
        import { isLoggedIn, getUserId, getKgGraph, startGeneration, getTaskStatus, startBatchGeneration, getBatchStatus, smartPlanResources } from './assets/api.js';
        
        if (!isLoggedIn()) {
            window.location.href = 'auth.html';
        }

        const userId = getUserId();

        // 解析 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const prefillKp = urlParams.get('kp');
        const prefillType = urlParams.get('type');

        async function loadKgNodes() {
            const graph = await getKgGraph({ depth: 5 });
            if (!graph || !graph.nodes || !graph.nodes.length) {
                document.getElementById('kp-level-0').innerHTML = '<option value="">暂无可用知识点</option>';
                return;
            }

            // 构建树结构：通过 edges 建立 parent → children 映射
            const nodeMap = {};
            graph.nodes.forEach(n => { nodeMap[n.id] = { ...n, children: [] }; });

            const childSet = new Set();
            (graph.edges || []).forEach(e => {
                // IS_PART_OF: source 是子节点, target 是父节点
                // CONTAINS: source 是父节点, target 是子节点
                if (e.relation === 'IS_PART_OF' && nodeMap[e.source_id] && nodeMap[e.target_id]) {
                    nodeMap[e.target_id].children.push(nodeMap[e.source_id]);
                    childSet.add(e.source_id);
                } else if (e.relation === 'CONTAINS' && nodeMap[e.source_id] && nodeMap[e.target_id]) {
                    nodeMap[e.source_id].children.push(nodeMap[e.target_id]);
                    childSet.add(e.target_id);
                }
            });

            // 根节点：没有被任何 IS_PART_OF/CONTAINS 指向为子节点的
            const roots = graph.nodes.filter(n => !childSet.has(n.id));

            // 类型排序优先级
            const typePriority = { Course: 0, Chapter: 1, KnowledgePoint: 2, SubPoint: 3, Concept: 4 };
            const sortNodes = (arr) => arr.sort((a, b) => (typePriority[a.type] || 9) - (typePriority[b.type] || 9) || a.name.localeCompare(b.name));

            // 存储树数据供级联使用
            window._kgTree = { nodeMap, roots: sortNodes(roots) };

            // 渲染第一级
            renderCascadeLevel(0, roots);

            // 预填充
            if (prefillKp) {
                const decodedKp = decodeURIComponent(prefillKp);
                // 找到匹配节点并展开路径
                const target = graph.nodes.find(n => n.name === decodedKp || n.id === decodedKp);
                if (target) selectNodeById(target.id);
            }
        }

        function renderCascadeLevel(level, nodes) {
            const container = document.getElementById('kp-cascade');
            // 移除当前级别及之后的所有 select
            const existing = container.querySelectorAll('.form-select');
            for (let i = level; i < existing.length; i++) existing[i].remove();

            if (!nodes || !nodes.length) { updateSelectedPath(); return; }

            const typeLabels = { Course: '课程', Chapter: '章节', KnowledgePoint: '知识点', SubPoint: '子知识点', Concept: '概念' };
            const typePriority = { Course: 0, Chapter: 1, KnowledgePoint: 2, SubPoint: 3, Concept: 4 };
            const sorted = [...nodes].sort((a, b) => (typePriority[a.type] || 9) - (typePriority[b.type] || 9) || a.name.localeCompare(b.name));

            const levelType = sorted[0]?.type;
            const placeholder = typeLabels[levelType] || '下一级';

            const sel = document.createElement('select');
            sel.className = 'form-select';
            sel.id = `kp-level-${level}`;
            sel.innerHTML = `<option value="">-- 选择${placeholder} --</option>` +
                sorted.map(n => `<option value="${n.id}">${n.name}</option>`).join('');
            sel.addEventListener('change', () => onCascadeChange(level));
            container.appendChild(sel);
            updateSelectedPath();
        }

        function onCascadeChange(level) {
            const sel = document.getElementById(`kp-level-${level}`);
            const nodeId = sel.value;
            const container = document.getElementById('kp-cascade');
            // 移除下级 selects
            const existing = container.querySelectorAll('.form-select');
            for (let i = level + 1; i < existing.length; i++) existing[i].remove();

            if (nodeId && window._kgTree) {
                const node = window._kgTree.nodeMap[nodeId];
                if (node && node.children && node.children.length) {
                    renderCascadeLevel(level + 1, node.children);
                }
            }
            updateSelectedPath();
        }

        function getSelectedKpId() {
            // 返回最深层级选中的值
            const container = document.getElementById('kp-cascade');
            const selects = container.querySelectorAll('.form-select');
            let lastValue = '';
            for (const sel of selects) {
                if (sel.value) lastValue = sel.value;
            }
            return lastValue;
        }

        function getSelectedKpName() {
            const container = document.getElementById('kp-cascade');
            const selects = container.querySelectorAll('.form-select');
            let lastName = '';
            for (const sel of selects) {
                if (sel.value) {
                    const opt = sel.options[sel.selectedIndex];
                    if (opt) lastName = opt.textContent;
                }
            }
            return lastName;
        }

        function updateSelectedPath() {
            const container = document.getElementById('kp-cascade');
            const pathEl = document.getElementById('kp-selected-path');
            const selects = container.querySelectorAll('.form-select');
            const parts = [];
            for (const sel of selects) {
                if (sel.value) {
                    const opt = sel.options[sel.selectedIndex];
                    if (opt) parts.push(opt.textContent);
                }
            }
            if (parts.length > 1) {
                pathEl.textContent = '路径：' + parts.join(' → ');
                pathEl.style.display = 'block';
            } else {
                pathEl.style.display = 'none';
            }
        }

        function selectNodeById(targetId) {
            // 找到从根到目标的路径，逐级选中
            if (!window._kgTree) return;
            const { nodeMap, roots } = window._kgTree;
            const path = [];
            function findPath(nodes, id) {
                for (const n of nodes) {
                    if (n.id === id) { path.push(n.id); return true; }
                    if (n.children && n.children.length) {
                        path.push(n.id);
                        if (findPath(n.children, id)) return true;
                        path.pop();
                    }
                }
                return false;
            }
            findPath(roots, targetId);
            // 逐级选中
            let currentNodes = roots;
            for (let i = 0; i < path.length; i++) {
                const sel = document.getElementById(`kp-level-${i}`);
                if (sel) {
                    sel.value = path[i];
                    const node = nodeMap[path[i]];
                    if (node && node.children && node.children.length && i < path.length - 1) {
                        renderCascadeLevel(i + 1, node.children);
                    }
                }
            }
            updateSelectedPath();
        }

        async function handleGenerate() {
            const kpId = getSelectedKpId();
            const kpName = getSelectedKpName();
            const selectedTypes = getSelectedResourceTypes();

            if (!kpId) {
                alert('请选择知识点');
                return;
            }
            if (selectedTypes.length === 0) {
                alert('请至少选择一种资源类型');
                return;
            }

            let numQuestions = 4;
            let questionTypeCounts = null;
            if (selectedTypes.includes('quiz')) {
                const single = parseInt(document.getElementById('count-single').value, 10) || 0;
                const multi = parseInt(document.getElementById('count-multi').value, 10) || 0;
                const fill = parseInt(document.getElementById('count-fill').value, 10) || 0;
                questionTypeCounts = { single, multi, fill };
                numQuestions = single + multi + fill;
                if (numQuestions <= 0 || numQuestions > 20) {
                    alert('题目总数需在 1-20 之间');
                    return;
                }
            }

            document.getElementById('result-empty').style.display = 'none';
            document.getElementById('result-progress').style.display = 'block';
            document.getElementById('result-content').style.display = 'none';
            document.getElementById('batch-result-tabs').style.display = 'none';

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                if (selectedTypes.length === 1) {
                    // 单资源：走原有逻辑
                    const task = await startGeneration(userId, kpId, selectedTypes[0], numQuestions, questionTypeCounts);
                    if (!task || !task.task_id) throw new Error('生成任务创建失败');
                    pollSingleTask(task.task_id, btn);
                } else {
                    // 多资源：走批量逻辑
                    const batch = await startBatchGeneration(userId, kpId, selectedTypes, numQuestions, questionTypeCounts);
                    if (!batch || !batch.batch_id) throw new Error('批量生成任务创建失败');
                    pollBatchTask(batch.batch_id, batch.tasks, btn);
                }
            } catch (e) {
                alert('生成失败: ' + e.message);
                btn.disabled = false;
                btn.textContent = '开始生成';
                document.getElementById('result-empty').style.display = 'flex';
                document.getElementById('result-progress').style.display = 'none';
            }
        }

        function pollSingleTask(taskId, btn) {
            let attempts = 0;
            const poll = async () => {
                if (attempts++ > 200) {
                    alert('生成超时，请稍后刷新页面查看结果');
                    btn.disabled = false;
                    btn.textContent = '开始生成';
                    return;
                }
                const status = await getTaskStatus(taskId);
                if (!status) { setTimeout(poll, 1500); return; }
                const pct = status.progress || 0;
                document.getElementById('progress-fill').style.width = pct + '%';
                document.getElementById('progress-text').textContent = `生成中... ${pct}%`;
                if (status.status === 'done' || status.status === 'completed') {
                    btn.disabled = false;
                    btn.textContent = '开始生成';
                    document.getElementById('result-progress').style.display = 'none';
                    document.getElementById('result-content').style.display = 'block';
                    document.getElementById('result-content').innerHTML = `
                        <div class="result-success">
                            <div class="result-success-icon"><i data-lucide="check-circle"></i></div>
                            <div class="result-success-title">资源生成完成</div>
                            <div style="font-size:14px;color:#6B7280;margin-top:8px;">资源已保存到资源库</div>
                        </div>`;
                    lucide.createIcons();
                } else if (status.status === 'failed') {
                    btn.disabled = false;
                    btn.textContent = '开始生成';
                    document.getElementById('result-progress').style.display = 'none';
                    document.getElementById('result-empty').style.display = 'flex';
                    alert('生成失败: ' + (status.error_msg || '未知错误'));
                } else {
                    setTimeout(poll, 1500);
                }
            };
            poll();
        }

        const TYPE_LABELS = { doc: '文档', mindmap: '思维导图', quiz: '测验题', code: '代码', summary: '总结' };

        function pollBatchTask(batchId, initialTasks, btn) {
            let attempts = 0;
            const poll = async () => {
                if (attempts++ > 300) {
                    alert('生成超时');
                    btn.disabled = false;
                    btn.textContent = '开始生成';
                    return;
                }
                const batch = await getBatchStatus(batchId);
                if (!batch) { setTimeout(poll, 1500); return; }

                const pct = batch.progress || 0;
                document.getElementById('progress-fill').style.width = pct + '%';
                document.getElementById('progress-text').textContent = `批量生成中... ${pct}%`;

                // 渲染子任务进度
                const subEl = document.getElementById('batch-sub-progress');
                subEl.innerHTML = batch.tasks.map(t => {
                    const label = TYPE_LABELS[t.resource_type] || t.resource_type;
                    const statusText = t.status === 'done' ? '完成' : t.status === 'failed' ? '失败' : `${t.progress}%`;
                    const color = t.status === 'done' ? '#4CAF50' : t.status === 'failed' ? '#F44336' : '#1976D2';
                    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                        <span style="font-size:13px;min-width:60px;">${label}</span>
                        <div style="flex:1;height:6px;background:#E0E6ED;border-radius:3px;overflow:hidden;">
                            <div style="width:${t.progress}%;height:100%;background:${color};transition:width 0.3s;"></div>
                        </div>
                        <span style="font-size:12px;color:${color};">${statusText}</span>
                    </div>`;
                }).join('');

                if (batch.status === 'done' || batch.status === 'failed') {
                    btn.disabled = false;
                    btn.textContent = '开始生成';
                    document.getElementById('result-progress').style.display = 'none';
                    window._lastBatchTasks = batch.tasks;
                    showBatchResults(batch.tasks);
                } else {
                    setTimeout(poll, 1500);
                }
            };
            poll();
        }

        function showBatchResults(tasks) {
            const tabsContainer = document.getElementById('batch-result-tabs');
            const tabBar = document.getElementById('batch-tab-bar');
            const tabContent = document.getElementById('batch-tab-content');
            tabsContainer.style.display = 'block';

            tabBar.innerHTML = tasks.map((t, i) => {
                const label = TYPE_LABELS[t.resource_type] || t.resource_type;
                const isActive = i === 0 ? 'border-bottom:2px solid #1976D2;color:#1976D2;' : '';
                const icon = t.status === 'done' ? '&#10003;' : '&#10007;';
                const iconColor = t.status === 'done' ? '#4CAF50' : '#F44336';
                return `<button onclick="switchBatchTab(${i})" class="batch-tab-btn" data-idx="${i}" style="padding:8px 16px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;${isActive}">
                    <span style="color:${iconColor};margin-right:4px;">${icon}</span>${label}
                </button>`;
            }).join('');

            // Show first tab content
            showTabContent(tasks, 0, tabContent);
        }

        function showTabContent(tasks, idx, container) {
            const t = tasks[idx];
            if (t.status === 'done') {
                container.innerHTML = `<div class="result-success">
                    <div class="result-success-icon"><i data-lucide="check-circle"></i></div>
                    <div class="result-success-title">${TYPE_LABELS[t.resource_type] || t.resource_type} 生成完成</div>
                    <div style="font-size:14px;color:#6B7280;margin-top:8px;">资源已保存到资源库</div>
                </div>`;
            } else {
                container.innerHTML = `<div style="color:#F44336;padding:16px;">
                    <strong>生成失败</strong><br>
                    <span style="font-size:13px;">${t.error_message || '未知错误'}</span>
                </div>`;
            }
            lucide.createIcons();
        }

        function switchBatchTab(idx) {
            const btns = document.querySelectorAll('.batch-tab-btn');
            btns.forEach(b => b.style.borderBottom = 'none');
            btns.forEach(b => b.style.color = '#1A1A2E');
            btns[idx].style.borderBottom = '2px solid #1976D2';
            btns[idx].style.color = '#1976D2';
            // Re-fetch tasks from last known state
            if (window._lastBatchTasks) {
                showTabContent(window._lastBatchTasks, idx, document.getElementById('batch-tab-content'));
            }
        }
        window.switchBatchTab = switchBatchTab;

        function getSelectedResourceTypes() {
            const checkboxes = document.querySelectorAll('input[name="resource_type"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        async function handleSmartRecommend() {
            const kpId = getSelectedKpId();
            if (!kpId) {
                alert('请先选择知识点');
                return;
            }
            const btn = document.getElementById('smart-recommend-btn');
            btn.disabled = true;
            btn.textContent = '推荐中...';
            try {
                const result = await smartPlanResources(userId, kpId);
                if (result && result.resource_types) {
                    // 取消所有选中
                    document.querySelectorAll('input[name="resource_type"]').forEach(cb => {
                        cb.checked = false;
                        cb.closest('.form-radio').classList.remove('selected');
                    });
                    // 选中推荐的类型
                    result.resource_types.forEach(rt => {
                        const cb = document.querySelector(`input[name="resource_type"][value="${rt}"]`);
                        if (cb) {
                            cb.checked = true;
                            cb.closest('.form-radio').classList.add('selected');
                        }
                    });
                    updateGenerateButtonText();
                    updateQuizVisibility();
                }
            } catch (e) {
                alert('智能推荐失败: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="sparkles" style="width:14px;height:14px;"></i> 智能推荐';
                lucide.createIcons();
            }
        }
        window.handleSmartRecommend = handleSmartRecommend;

        window.handleGenerate = handleGenerate;
        function syncQuizTotal() {
            const s = parseInt(document.getElementById('count-single').value, 10) || 0;
            const m = parseInt(document.getElementById('count-multi').value, 10) || 0;
            const f = parseInt(document.getElementById('count-fill').value, 10) || 0;
            const total = s + m + f;
            document.getElementById('quiz-total-hint').textContent = `共 ${total} 道（不超过20道）`;
        }
        function toggleCheckbox(label) {
            const cb = label.querySelector('input');
            // Toggle is handled by browser default for checkbox, just update styling
            setTimeout(() => {
                if (cb.checked) {
                    label.classList.add('selected');
                } else {
                    label.classList.remove('selected');
                }
                updateQuizVisibility();
                updateGenerateButtonText();
            }, 0);
        }
        function updateQuizVisibility() {
            const quizChecked = document.querySelector('input[name="resource_type"][value="quiz"]')?.checked;
            const quizGroup = document.getElementById('quiz-count-group');
            const typeInputs = document.getElementById('quiz-type-inputs');
            if (quizChecked) {
                quizGroup.style.display = 'block';
                typeInputs.style.display = 'block';
                syncQuizTotal();
            } else {
                quizGroup.style.display = 'none';
                typeInputs.style.display = 'none';
            }
        }
        function updateGenerateButtonText() {
            const count = getSelectedResourceTypes().length;
            const btn = document.getElementById('generate-btn');
            if (count > 1) {
                btn.textContent = `批量生成 (${count}项)`;
            } else {
                btn.textContent = '开始生成';
            }
        }
        window.toggleCheckbox = toggleCheckbox;
        window.syncQuizTotal = syncQuizTotal;

        loadKgNodes().then(() => {
            // 预填充资源类型
            if (prefillType) {
                const cb = document.querySelector(`input[name="resource_type"][value="${prefillType}"]`);
                if (cb) {
                    cb.checked = true;
                    const label = cb.closest('.form-radio');
                    if (label) label.classList.add('selected');
                    updateQuizVisibility();
                    updateGenerateButtonText();
                }
            }
        });
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
