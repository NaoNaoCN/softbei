<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配色方案预览 · 智学实验室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Hanken Grotesk','Noto Sans SC',sans-serif;
    background:#E9ECF3; color:#1F2738; padding:48px 32px 80px; line-height:1.6;
}
.head { max-width:1200px; margin:0 auto 40px; }
.kicker { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#7C8AA5; font-weight:600; }
h1 { font-family:'Bricolage Grotesque','Noto Sans SC',sans-serif; font-size:38px; font-weight:800; letter-spacing:-.02em; margin-top:8px; }
.head p { color:#5A6478; margin-top:10px; max-width:640px; }
.grid { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
@media(max-width:980px){ .grid{ grid-template-columns:1fr; } }

.scheme { border-radius:24px; padding:26px; position:relative; overflow:hidden; box-shadow:0 20px 50px rgba(31,39,56,.10); border:1px solid rgba(255,255,255,.5); }
/* blurred aurora orbs inside each scheme to show atmosphere */
.scheme .orb { position:absolute; border-radius:50%; filter:blur(48px); opacity:.7; }
.scheme .orb.a { width:220px; height:220px; top:-60px; right:-40px; }
.scheme .orb.b { width:180px; height:180px; bottom:-50px; left:-30px; }
.scheme-inner { position:relative; z-index:1; }
.tag { display:inline-block; font-size:11px; letter-spacing:.08em; font-weight:700; padding:4px 10px; border-radius:999px; }
.scheme h2 { font-family:'Bricolage Grotesque','Noto Sans SC',sans-serif; font-size:24px; font-weight:800; margin-top:14px; letter-spacing:-.01em; }
.scheme .en { font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; font-weight:600; }

/* frosted glass demo card */
.glass-demo { margin-top:18px; border-radius:16px; padding:16px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.glass-demo .gd-row { display:flex; align-items:center; gap:10px; }
.glass-demo .gd-orb { width:34px; height:34px; border-radius:10px; flex-shrink:0; }
.glass-demo .gd-t { font-weight:700; font-size:14px; }
.glass-demo .gd-s { font-size:11.5px; opacity:.6; }
.glass-demo .gd-bar { height:7px; border-radius:99px; margin-top:14px; }

/* mini centered-core layout mock */
.mock { margin-top:18px; display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:7px; align-items:center; }
.mock .m { border-radius:9px; height:46px; backdrop-filter:blur(8px); }
.mock .m.core { height:72px; border-radius:12px; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; }

/* swatches */
.swatches { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
.sw { text-align:center; }
.sw .dot { width:40px; height:40px; border-radius:11px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.sw .hex { font-size:9.5px; margin-top:5px; opacity:.6; font-family:'Hanken Grotesk',monospace; letter-spacing:.02em; }
.note { font-size:12.5px; margin-top:16px; opacity:.7; }
.font-line { font-family:'Bricolage Grotesque','Noto Sans SC',sans-serif; font-weight:700; margin-top:16px; font-size:15px; }
</style>
</head>
<body>
<div class="head">
    <div class="kicker">COLOR DIRECTION · 浅色系候选</div>
    <h1>三套浅色方案，请挑一套</h1>
    <p>已弃用深空星空配色。下面三套均保留「毛玻璃通透质感」，但换成浅色画布、高透明度玻璃，并附带「AI 核心居中」的新布局缩略图。每套都是真实渲染的颜色 —— 直接看哪套顺眼。</p>
</div>
<div class="grid" id="grid"></div>

<!-- DATA_PLACEHOLDER -->
<script>
const schemes = [
  {
    name:'晨雾天青', en:'Porcelain Mist', tagBg:'#DCE7F5', tagFg:'#2B5C9B',
    bg:'linear-gradient(160deg,#F4F8FE 0%,#E7EFFA 100%)',
    orbA:'radial-gradient(circle,#9DBDF0,transparent 70%)',
    orbB:'radial-gradient(circle,#B8E3E0,transparent 70%)',
    glass:'rgba(255,255,255,.55)', glassBorder:'rgba(255,255,255,.8)',
    text:'#1E2A3F', accent:'#3B6FD4', accent2:'#34B8C4',
    core:'linear-gradient(135deg,#3B6FD4,#5AA0E0)',
    swatches:[['画布','#EEF4FC'],['玻璃','#FFFFFFCC'],['主色','#3B6FD4'],['青','#34B8C4'],['文字','#1E2A3F']],
    note:'最稳妥。清爽天青蓝 + 微青点缀，接近多数教育/SaaS 产品的明亮专业感，对比度高、长时间看不累。'
  },
  {
    name:'暖砂米白', en:'Warm Sand', tagBg:'#F0E6D8', tagFg:'#9A6B36',
    bg:'linear-gradient(160deg,#FBF7F1 0%,#F3ECE1 100%)',
    orbA:'radial-gradient(circle,#F2C89B,transparent 70%)',
    orbB:'radial-gradient(circle,#C9D6B5,transparent 70%)',
    glass:'rgba(255,255,255,.50)', glassBorder:'rgba(255,255,255,.85)',
    text:'#33291E', accent:'#C77B3C', accent2:'#7A9367',
    core:'linear-gradient(135deg,#C77B3C,#E0A85C)',
    swatches:[['画布','#F7F1E8'],['玻璃','#FFFFFFC0'],['主色','#C77B3C'],['橄榄','#7A9367'],['文字','#33291E']],
    note:'最温暖独特。米白 + 赤陶橙 + 橄榄绿，有纸感与人文气息，区别于满屏蓝紫的同质化产品，更有「学习伴侣」温度。'
  },
  {
    name:'薄荷晴空', en:'Mint Daylight', tagBg:'#D6EFE4', tagFg:'#1E7A5E',
    bg:'linear-gradient(160deg,#F2FBF7 0%,#E5F4FB 100%)',
    orbA:'radial-gradient(circle,#9EE6C8,transparent 70%)',
    orbB:'radial-gradient(circle,#A9D7F2,transparent 70%)',
    glass:'rgba(255,255,255,.52)', glassBorder:'rgba(255,255,255,.82)',
    text:'#16302A', accent:'#10A37F', accent2:'#3E8ED0',
    core:'linear-gradient(135deg,#10A37F,#36C39A)',
    swatches:[['画布','#EDF8F3'],['玻璃','#FFFFFFC4'],['主色','#10A37F'],['天蓝','#3E8ED0'],['文字','#16302A']],
    note:'最有活力。薄荷绿主色 + 晴空蓝,清新有「成长/进步」隐喻,科技感与亲和力兼顾,绿色在视觉上比蓝更放松。'
  },
];

const grid = document.getElementById('grid');
grid.innerHTML = schemes.map(s => `
  <div class="scheme" style="background:${s.bg};color:${s.text};">
    <div class="orb a" style="background:${s.orbA};"></div>
    <div class="orb b" style="background:${s.orbB};"></div>
    <div class="scheme-inner">
      <span class="tag" style="background:${s.tagBg};color:${s.tagFg};">方案 ${schemes.indexOf(s)+1}</span>
      <h2>${s.name}</h2>
      <div class="en">${s.en}</div>

      <div class="glass-demo" style="background:${s.glass};border:1px solid ${s.glassBorder};box-shadow:0 8px 24px rgba(31,39,56,.10);">
        <div class="gd-row">
          <div class="gd-orb" style="background:${s.core};box-shadow:0 4px 12px rgba(0,0,0,.12);"></div>
          <div><div class="gd-t">AI 智能核心</div><div class="gd-s">毛玻璃卡片 · 透明度演示</div></div>
        </div>
        <div class="gd-bar" style="background:${s.core};width:72%;"></div>
        <div class="gd-bar" style="background:${s.accent2};opacity:.35;width:48%;height:6px;"></div>
      </div>

      <div class="mock">
        <div class="m" style="background:${s.glass};border:1px solid ${s.glassBorder};"></div>
        <div class="m core" style="background:${s.core};">AI 核心居中</div>
        <div class="m" style="background:${s.glass};border:1px solid ${s.glassBorder};"></div>
      </div>

      <div class="swatches">
        ${s.swatches.map(([lbl,hex]) => `
          <div class="sw"><div class="dot" style="background:${hex};"></div><div class="hex">${lbl}</div></div>
        `).join('')}
      </div>

      <div class="font-line" style="color:${s.accent};">智学实验室 · Aa Bb 123</div>
      <div class="note">${s.note}</div>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
