<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习看板 - 个性化学习助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <link rel="stylesheet" href="./assets/styles.css">
    <link rel="stylesheet" href="./assets/assistant.css">
    <style>
        /* 首页特有样式 */
        .stat-icon-box {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin-bottom: 12px;
        }
        .stat-icon-box.blue   { background: linear-gradient(135deg, #4F6EF7, #60A5FA); }
        .stat-icon-box.purple { background: linear-gradient(135deg, #7C5CFC, #A78BFA); }
        .stat-icon-box.orange { background: linear-gradient(135deg, #F59E0B, #FBBF24); }
        .stat-icon-box.green  { background: linear-gradient(135deg, #10B981, #34D399); }

        .welcome-gradient {
            position: fixed;
            top: -120px; right: -80px;
            width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(79,110,247,0.06) 0%, rgba(124,92,252,0.03) 50%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .content-area { position: relative; z-index: 1; }
    </style>
</head>
<body>
    <!-- 背景光晕装饰 -->
    <div class="welcome-gradient"></div>

    <!-- Sidebar -->
    <nav class="sidebar">
        <a href="index.html" class="sidebar-logo">
            <div class="sidebar-logo-icon">S</div>
            智能学习
        </a>
        <div class="sidebar-section-title">主菜单</div>
        <a href="index.html" class="nav-item active">
            <span class="icon"><i data-lucide="home"></i></span>学习看板
        </a>
        <a href="chat.html" class="nav-item">
            <span class="icon"><i data-lucide="message-square"></i></span>智能对话
        </a>
        <a href="generate.html" class="nav-item">
            <span class="icon"><i data-lucide="sparkles"></i></span>资源生成
        </a>
        <a href="library.html" class="nav-item">
            <span class="icon"><i data-lucide="library"></i></span>资源库
        </a>
        <a href="pathway.html" class="nav-item">
            <span class="icon"><i data-lucide="share-2"></i></span>学习路径
        </a>
        <a href="evaluate.html" class="nav-item">
            <span class="icon"><i data-lucide="clipboard-check"></i></span>学习评估
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon"><i data-lucide="circle-user"></i></span>个人中心
        </a>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-avatar" id="sidebar-avatar">?</div>
                <span class="user-info" id="user-info">加载中...</span>
            </div>
            <button class="btn-logout" data-action="logout">
                <i data-lucide="log-out" style="width:16px;height:16px;"></i>退出登录
            </button>
        </div>
    </nav>

    <!-- Main -->
    <main class="main">
        <div class="content-area">

            <!-- 欢迎区 -->
            <div class="page-header">
                <div>
                    <div class="greeting" id="greeting">欢迎回来</div>
                    <div class="greeting-sub">今天也一起学习吧</div>
                </div>
                <div class="page-header-right">
                    <div class="header-date" id="header-date"></div>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="card-stat accent-blue animate-fade-in-up delay-1">
                    <div class="stat-icon-box blue"><i data-lucide="file-text"></i></div>
                    <div class="stat-label">学习文档</div>
                    <div class="stat-value" id="stat-doc">-</div>
                    <div class="stat-trend neutral" id="stat-doc-trend"></div>
                </div>
                <div class="card-stat accent-purple animate-fade-in-up delay-2">
                    <div class="stat-icon-box purple"><i data-lucide="git-branch"></i></div>
                    <div class="stat-label">思维导图</div>
                    <div class="stat-value" id="stat-mindmap">-</div>
                    <div class="stat-trend neutral" id="stat-mm-trend"></div>
                </div>
                <div class="card-stat accent-orange animate-fade-in-up delay-3">
                    <div class="stat-icon-box orange"><i data-lucide="clipboard-list"></i></div>
                    <div class="stat-label">测验</div>
                    <div class="stat-value" id="stat-quiz">-</div>
                    <div class="stat-trend neutral" id="stat-quiz-trend"></div>
                </div>
                <div class="card-stat accent-green animate-fade-in-up delay-4">
                    <div class="stat-icon-box green"><i data-lucide="map"></i></div>
                    <div class="stat-label">学习路径</div>
                    <div class="stat-value" id="stat-paths">-</div>
                    <div class="stat-trend neutral" id="stat-path-trend"></div>
                </div>
            </div>

            <!-- 双栏 -->
            <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:24px;">

                <!-- 最近学习动态 -->
                <div class="card animate-fade-in-up delay-5">
                    <div class="card-title" style="display:flex;align-items:center;gap:8px;">
                        <i data-lucide="clock" style="width:18px;height:18px;color:var(--color-text-tertiary);"></i>
                        最近学习动态
                    </div>
                    <div id="recent-loading" class="loading"><span class="spinner spinner-dark"></span>加载中...</div>
                    <div id="recent-timeline" class="timeline" style="display:none;"></div>
                    <div id="recent-empty" class="no-data" style="display:none;">暂无学习动态，开始生成你的第一份学习资源吧</div>
                </div>

                <!-- 我的学习画像 -->
                <div class="card animate-fade-in-up delay-6">
                    <div class="card-title" style="display:flex;align-items:center;gap:8px;">
                        <i data-lucide="user" style="width:18px;height:18px;color:var(--color-text-tertiary);"></i>
                        我的学习画像
                    </div>
                    <div id="profile-loading" class="loading"><span class="spinner spinner-dark"></span>加载中...</div>
                    <div id="profile-content" style="display:none;">
                        <div class="profile-grid" style="grid-template-columns:repeat(2,1fr);">
                            <div><div class="profile-label">专业</div><div class="profile-value" id="prof-major">-</div></div>
                            <div><div class="profile-label">每日学习</div><div class="profile-value" id="prof-daily">-</div></div>
                            <div><div class="profile-label">认知风格</div><div class="profile-value" id="prof-cognitive">-</div></div>
                            <div><div class="profile-label">学习目标</div><div class="profile-value" id="prof-goal">-</div></div>
                        </div>
                        <div class="mt-4"><div class="profile-label mb-2">已掌握知识点</div>
                            <div class="tags-list" id="prof-mastered"></div>
                        </div>
                        <div class="mt-4"><div class="profile-label mb-2">待提升知识点</div>
                            <div class="tags-list" id="prof-weak"></div>
                        </div>
                    </div>
                    <div id="profile-empty" class="no-data" style="display:none;">
                        尚未建立画像，<a href="profile.html" style="color:var(--color-primary);">前往编辑</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { isLoggedIn, getUserId, clearAuth, getResourceStats, getProfile, getPathways, getLearningRecords } from './assets/api.js';
        import { showToast } from './assets/toast.js';
        import { registerActions } from './assets/button.js';
        import { initCommandPalette } from './assets/command.js';

        if (!isLoggedIn()) { window.location.href = 'auth.html'; }

        const userId = getUserId();

        // 注册全局操作
        registerActions({
            logout: async (data, btn) => {
                clearAuth();
                window.location.href = 'auth.html';
            },
        });

        // 初始化命令面板
        initCommandPalette();

        // 问候语
        function setGreeting() {
            const h = new Date().getHours();
            const name = userId ? userId.slice(0, 6) : '';
            const greet = h < 6 ? '夜深了' : h < 9 ? '早上好' : h < 12 ? '上午好' : h < 14 ? '中午好' : h < 17 ? '下午好' : '晚上好';
            document.getElementById('greeting').textContent = greet + (name ? '，' + name : '') + ' ';
            const d = new Date();
            const week = ['周日','周一','周二','周三','周四','周五','周六'];
            document.getElementById('header-date').textContent =
                d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + week[d.getDay()];
        }
        setGreeting();

        // 侧边栏用户信息
        const shortId = userId ? userId.slice(0, 8) : '?';
        document.getElementById('user-info').textContent = shortId;
        document.getElementById('sidebar-avatar').textContent = shortId.charAt(0).toUpperCase();

        // 数字递增动画
        function animateCount(el, target) {
            if (!target || target === 0) { el.textContent = target || '0'; return; }
            const duration = 600;
            const start = performance.now();
            const step = (ts) => {
                const p = Math.min((ts - start) / duration, 1);
                el.textContent = Math.floor(p * target);
                if (p < 1) requestAnimationFrame(step);
                else el.textContent = target;
            };
            requestAnimationFrame(step);
        }

        // 加载统计数据
        async function loadStats() {
            const stats = await getResourceStats(userId);
            if (stats) {
                animateCount(document.getElementById('stat-doc'), stats.doc || 0);
                animateCount(document.getElementById('stat-mindmap'), stats.mindmap || 0);
                animateCount(document.getElementById('stat-quiz'), stats.quiz || 0);
            }
        }

        // 加载路径
        async function loadPathways() {
            const pathways = await getPathways(userId);
            if (pathways) {
                animateCount(document.getElementById('stat-paths'), pathways.length || 0);
            }
        }

        // 加载最近动态
        async function loadRecent() {
            const el = document.getElementById('recent-timeline');
            const loading = document.getElementById('recent-loading');
            const empty = document.getElementById('recent-empty');
            try {
                const records = await getLearningRecords(userId, { limit: 6 });
                loading.style.display = 'none';
                if (!records || records.length === 0) { empty.style.display = 'block'; return; }
                el.style.display = 'block';
                el.innerHTML = records.slice(0, 6).map(r => `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-time">${formatTimeAgo(r.created_at || r.updated_at)}</div>
                        <div class="timeline-text">${formatRecordText(r)}</div>
                    </div>
                `).join('');
            } catch(e) { loading.style.display = 'none'; empty.style.display = 'block'; }
        }

        function formatTimeAgo(t) {
            if (!t) return '刚刚';
            const diff = Date.now() - new Date(t).getTime();
            const min = Math.floor(diff / 60000);
            if (min < 1) return '刚刚';
            if (min < 60) return min + '分钟前';
            const h = Math.floor(min / 60);
            if (h < 24) return h + '小时前';
            return Math.floor(h / 24) + '天前';
        }

        function formatRecordText(r) {
            const t = r.resource_type || '';
            const typeMap = { doc:'学习文档', mindmap:'思维导图', quiz:'测验', code:'代码示例', summary:'要点总结', animation:'动画演示' };
            const typeName = typeMap[t] || t || '资源';
            const title = r.title || r.resource_title || r.kp_name || '';
            if (title) return '学习了' + typeName + '《' + title + '》';
            return '完成了一次' + typeName + '学习';
        }

        // 加载画像
        async function loadProfile() {
            const profile = await getProfile(userId);
            const loading = document.getElementById('profile-loading');
            const content = document.getElementById('profile-content');
            const empty = document.getElementById('profile-empty');
            if (!profile) { loading.style.display = 'none'; empty.style.display = 'block'; return; }
            loading.style.display = 'none';
            content.style.display = 'block';
            document.getElementById('prof-major').textContent = profile.major || '未设置';
            document.getElementById('prof-daily').textContent = profile.daily_time_minutes ? profile.daily_time_minutes + ' 分钟' : '未设置';
            document.getElementById('prof-cognitive').textContent = profile.cognitive_style || '未设置';
            document.getElementById('prof-goal').textContent = profile.learning_goal || '未设置';
            const mastered = profile.knowledge_mastered || [];
            document.getElementById('prof-mastered').innerHTML = mastered.length
                ? mastered.map(k => '<span class="badge badge-success">' + k + '</span>').join('')
                : '<span class="text-sm text-muted">暂无</span>';
            const weak = profile.knowledge_weak || [];
            document.getElementById('prof-weak').innerHTML = weak.length
                ? weak.map(k => '<span class="badge badge-warning">' + k + '</span>').join('')
                : '<span class="text-sm text-muted">暂无</span>';
        }


        loadStats();
        loadPathways();
        loadRecent();
        loadProfile();
    </script>
    <script>lucide.createIcons();</script>
    <script src="./assets/tracker.js"></script>
    <script src="./assets/guide.js"></script>
    <script type="module" src="./assets/assistant.js"></script>
</body>
</html>
