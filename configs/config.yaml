# ============================================================
# 项目配置文件
# 所有值通过 backend/config.py 加载为 Config 单例
# 支持 ${ENV_VAR} 语法从环境变量读取敏感值
# ============================================================

# ----------------------------------------------------------
# 数据库配置 — PostgreSQL + asyncpg
# 连接池详细文档：docs/DATABASE_CONNECTION_POOL.md
# ----------------------------------------------------------
database:
  url: "${DATABASE_URL}"               # 连接串，格式: postgresql+asyncpg://user:pass@host:5432/dbname
  echo: false                          # true=打印所有 SQL 到标准输出（仅调试用）

  # -- 连接池参数 --
  pool_size: 10                        # 常驻连接数，按需懒加载
  max_overflow: 20                     # pool_size 全部占用时可额外创建数，峰值 = pool_size + max_overflow = 30
  pool_timeout: 30                     # 连接池耗尽时等待可用连接的最大秒数
  pool_recycle: 3600                   # 单个连接最大存活秒数（1小时），超时自动回收防止服务端断开
  command_timeout: 60                  # asyncpg 语句级超时（秒），单条 SQL 超过此值自动取消

  # 注：pool_pre_ping=True 已在代码中硬编码开启（每次获取连接前 SELECT 1 探活）

# ----------------------------------------------------------
# 向量库配置 — PostgreSQL + pgvector 扩展
# ----------------------------------------------------------
vector_db:
  collection: "knowledge_base"          # 向量集合名称，对应 document_chunk 表的 collection_name 字段

# ----------------------------------------------------------
# LLM 配置 — 大语言模型调用参数
# 当前使用 DashScope（阿里云）qwen3.5 系列
# ----------------------------------------------------------
llm:
  api_key: "${LLM_API_KEY}"             # 从环境变量读取
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # API 地址（OpenAI 兼容格式）
  model: "qwen3.5-plus-2026-02-15"      # 默认模型名称
  provider: "qwen"                      # 当前使用的 Provider（详见 providers 子配置）
  default_max_tokens: 2048               # 默认最大输出 token 数（各 Agent 可独立覆盖）

  # -- 重试策略 — 指数退避 --
  retry:
    max_attempts: 5                      # 最大重试次数（含首次调用）
    backoff_multiplier: 2                # 退避乘数：等待秒数 = min(backoff_min × multiplier^attempt, backoff_max)
    backoff_min_seconds: 3               # 最小退避间隔（秒）
    backoff_max_seconds: 30              # 最大退避间隔（秒）

  # -- HTTP 超时（秒）-- 控制 httpx 底层请求的各阶段超时
  timeout:
    connect: 10                          # TCP 连接建立超时
    read: 120                            # 响应读取超时（生成类任务需较大值）
    write: 30                            # 请求写入超时
    pool: 10                             # 等待连接池中可用连接的超时

  # -- 各 Provider 独立配置 --
  # 切换 Provider 时只需改 llm.provider 和 llm.base_url，其余字段按 Provider 自动匹配
  providers:
    spark:
      base_url: "https://spark-api-open.xf-yun.com/v1"
      default_model: "generalv3.5"
    deepseek:
      base_url: "https://api.deepseek.com/v1"
      default_model: "deepseek-chat"
    qwen:
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      default_model: "qwen3.5-plus-2026-02-15"
    openai:
      base_url: "https://api.openai.com/v1"
      default_model: "gpt-4o-mini"

# ----------------------------------------------------------
# Embedding 配置 — 文本向量化（DashScope text-embedding-v4）
# ----------------------------------------------------------
embedding:
  use_spark: true                        # true=使用远程 Embedding API；false=使用本地模型（BGE-M3，已废弃）
  concurrency: 8                         # 嵌入并发数（同时调用的 API 上限，受限于 API 速率限制）
  api_model: "text-embedding-v4"         # Embedding API 模型名（DashScope）
  api_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  timeout_read: 60                       # API embedding 读取超时（秒）
  timeout_connect: 10                    # API embedding 连接超时（秒）
  timeout_write: 30                      # API embedding 写入超时（秒）
  timeout_pool: 10                       # API embedding 连接池超时（秒）
  index_batch_size: 10                   # 索引构建时每批处理的文本块数（DashScope API 上限 10）
  vector_dimension: 1024                 # 向量维度（text-embedding-v4 输出 1024 维）

# ----------------------------------------------------------
# RAG 配置 — 检索增强生成：文档切分 + 语义检索
# ----------------------------------------------------------
rag:
  chunk_size: 500                        # 文档切分块大小（字符数）
  chunk_overlap: 50                      # 相邻块之间的重叠字符数
  n_results: 5                           # 检索返回条数（默认值，API 可覆盖）
  score_threshold: 0.5                   # 最低余弦相似度阈值，低于此值的文档块被丢弃
  context_max_tokens: 3000               # RAG 注入上下文的 token 预算上限
  max_sections_before_coarse_split: 50   # 文档节数超过此值时，自动切换为粗粒度切分策略

  # -- 父子切割配置 — 章节=父块，段落=子块，检索命中子块后回填父块文本 --
  parent_chunking:
    enabled: true                        # 父子切割总开关（默认关闭，灰度上线）
    parent_max_chars: 2000               # 父块最大字符数（超出则按段落边界二次切分）
    child_chunk_size: null               # 子块大小，null 表示使用 rag.chunk_size（500）
    child_chunk_overlap: 100             # 子块重叠字符数（更大的重叠减少父子关系断裂）
    score_weight: "max"                  # 父块分数策略: "max"（取子块最高分）| "mean"（子块均分）

  # -- Query Rewrite 配置 — 检索前改写/扩展用户查询 --
  query_rewrite:
    enabled: true                         # 总开关：是否启用查询改写
    decontextualize: true                 # 策略A：对话去上下文化（指代消解）
    profile_aware: true                   # 策略B：画像感知改写（偏向薄弱点）
    multi_query: false                    # 策略C：多角度查询扩展（Phase 2 启用）
    multi_query_count: 3                  # 扩展查询条数
    temperature: 0.1                      # 改写 LLM 温度（需确定性）
    max_tokens: 150                       # 改写输出最大 token 数

# ----------------------------------------------------------
# 对话配置 — 聊天会话管理与历史截断
# ----------------------------------------------------------
chat:
  max_turns: 10                          # 多轮对话最大保留轮数（1 轮 = 1 user + 1 assistant）
  history_max_tokens: 4000               # 注入 LLM 的对话历史 token 预算
  message_max_length: 4096               # 单条消息最大字符数（超出截断）
  session_expiry_days: 30                # 对话会话过期天数（超出后自动清理）
  cleanup_interval_hours: 24             # 会话清理任务执行间隔（小时）

  # -- 自动标题生成 — 新建对话时由 LLM 自动生成标题 --
  auto_title_max_chars: 15               # 标题字数建议（给 LLM 的指令，非硬截断）
  auto_title_message_truncate: 200       # 标题生成时取首条消息的前 N 个字符
  auto_title_max_tokens: 30              # 标题生成的 max_tokens
  auto_title_final_length: 20            # 标题最终硬截断长度（字符）

  # -- Token 估算系数 — 用于在不调用 Tokenizer 的情况下估算 token 数 --
  token_estimation:
    cn_chars_per_token: 1.5              # 中文字符 / token（约 1.5 字/token）
    en_chars_per_token: 4.0              # 英文字符 / token（约 4 字符/token）

# ----------------------------------------------------------
# 知识图谱构建配置 — 从文档自动构建 KG
# ----------------------------------------------------------
knowledge_graph:
  llm_concurrency: 2                    # 构建时 LLM 并发上限（控制 API 调用并发）
  max_batches: 30                        # 送入 LLM 的最大文本批数（超出后裁剪）
  toc_max_items: 100                     # 目录条目数上限（超出后保留前 N 条）
  batch_chars_limit: 12000               # 每批送入 LLM 的最大字符数
  text_truncate_chars: 6000              # 单个文本段送入 LLM 的截断长度（用于节点提取提示词）
  node_extraction_max_tokens: 4000       # 节点提取的 LLM max_tokens
  edge_batch_size: 40                    # 边推理批量大小（一次 API 调用处理 N 对节点）
  edge_overlap: 10                       # 边推理批间重叠数（防止边界遗漏）
  section_merge_min_chars: 200           # 短于该字符数的相邻节会被合并为一个处理单元

# ----------------------------------------------------------
# 资源生成配置 — Agent 生成题目、思维导图、文档等学习资源
# ----------------------------------------------------------
generation:
  default_num_questions: 4               # 默认题目数量
  max_questions: 20                      # 单次生成题目上限
  mindmap_max_depth: 4                   # 思维导图最大层级深度
  mindmap_max_children: 6                # 思维导图每节点最大子项数

  # -- 题目生成 — 弱项阈值与配比 --
  # 根据学生薄弱知识点数量，动态调整题目难度配比 [基础题, 进阶题, 综合题]
  quiz:
    weak_threshold_high: 5               # 高弱项阈值：弱项数 > 此值时使用高弱项配比
    weak_threshold_mid: 2                # 中弱项阈值：弱项数 > 此值时使用中弱项配比
    counts_high: [3, 2, 2]               # 高弱项配比 [基础, 进阶, 综合]
    counts_mid: [2, 1, 1]                # 中弱项配比
    counts_default: [2, 1, 1]            # 默认配比（弱项数 <= mid 时使用）

# ----------------------------------------------------------
# 文档存储配置 — 上传文件管理 + 自动清理
# ----------------------------------------------------------
storage:
  upload_dir: "uploaded_docs"            # 上传文件存储目录（相对于项目根目录）
  knowledge_base_dir: "knowledge_base/ai_intro"  # 启动时自动索引的知识库目录
  supported_extensions: [".pdf", ".docx", ".doc", ".md", ".txt"]  # 支持的文件扩展名
  doc_id_hex_length: 12                  # 文档 ID 的十六进制长度（从 MD5 截取）

  # -- 自动清理策略 --
  cleanup:
    enabled: true                        # 是否启用自动清理
    retention_days: 30                   # 已成功索引的文件保留天数
    orphan_retention_days: 7             # 孤儿文件（导入失败/中断）的保留天数
    interval_hours: 24                   # 清理任务执行间隔（小时）
    min_file_age_seconds: 300            # 文件最小存在时间（秒），小于此值的文件不会被清理

# ----------------------------------------------------------
# 日志配置 — 基于 Loguru 的结构化日志
# ----------------------------------------------------------
logging:
  dir: "logs"                            # 日志文件目录
  retention_days: 30                     # 普通日志保留天数
  error_retention_days: 90               # 错误日志保留天数
  trace_id_length: 8                     # 追踪 ID 长度（取 UUID hex 前 N 字符）

# ----------------------------------------------------------
# JWT 配置 — 用户认证 Token
# ----------------------------------------------------------
jwt:
  secret: "${JWT_SECRET}"                # 签名密钥，从环境变量读取
  algorithm: "HS256"                     # 签名算法
  expire_hours: 24                       # Token 过期时间（小时）

# ----------------------------------------------------------
# Agent 配置 — 各 Agent 的 LLM 参数及业务常量
# temperature: 0=确定性输出，1=最大随机性
# ----------------------------------------------------------
agents:
  # -- 澄清 Agent — 向用户追问完善画像 --
  clarify:
    temperature: 0.7

  # -- 代码 Agent — 生成代码示例 --
  code:
    temperature: 0.7
    max_tokens: 5000                     # 代码输出通常较长

  # -- 文档 Agent — 生成学习文档 --
  doc:
    temperature: 0.7
    max_tokens: 4000

  # -- 思维导图 Agent — 生成结构化知识导图 --
  mindmap:
    temperature: 0.5                     # 较低温度保证结构一致性
    max_tokens: 2000

  # -- 规划 Agent — 意图识别 + 资源规划 --
  planner:
    intent_temperature: 0.0              # 意图识别需要确定性（分类任务）
    classify_temperature: 0.1            # 资源类型分类需要低随机性
    smart_plan_temperature: 0.3          # 智能规划可稍灵活
    history_lookback_messages: 6         # 规划时回顾的最近消息数
    fallback_kp_id_length: 50            # 兜底知识点 ID 截断长度（注入 prompt 时截断）
    smart_plan_default_types: ["doc", "quiz"]  # 智能规划默认生成的资源类型

  # -- 画像 Agent — 学生画像提取 + 目标摸底 --
  profile:
    extract_temperature: 0.1             # 画像提取需低温度保证准确性
    intent_temperature: 0.0              # 意图判断需确定性
    clarify_temperature: 0.7             # 追问可更灵活
    goal_summary_temperature: 0.3        # 目标总结适中
    max_goal_questions: 50               # 目标摸底最大出题数
    history_max_versions: 10             # 用户画像历史版本数上限（超出后删除旧版本）

  # -- 题目 Agent — 生成测验题目 --
  quiz:
    temperature: 0.6
    max_tokens: 3000

  # -- 推荐 Agent — 推荐后续学习知识点 --
  recommend:
    temperature: 0.7
    max_tokens: 2000
    min_recommendations: 3               # 最少推荐知识点数
    max_recommendations: 5               # 最多推荐知识点数

  # -- 安全 Agent — 内容安全审计 --
  safety:
    temperature: 0.1                     # 安全判断需低温度
    max_tokens: 300
    max_ref_docs: 3                      # 安全审计引用的最大文档数
    draft_preview_chars: 500             # 提交给安全审计的草稿预览字符数

  # -- 摘要 Agent — 生成学习内容摘要 --
  summary:
    temperature: 0.7
    max_tokens: 1200
    target_words_min: 300                # 摘要最低字数
    target_words_max: 500                # 摘要最高字数

# ----------------------------------------------------------
# 分页配置 — API 列表接口默认分页参数
# ----------------------------------------------------------
pagination:
  default_limit: 20                      # 通用列表默认每页条数
  quiz_attempts_limit: 50                # 答题记录列表默认每页条数

# ----------------------------------------------------------
# 服务配置 — FastAPI 应用参数
# ----------------------------------------------------------
server:
  version: "0.1.0"
  cors_origins: ["*"]                    # 允许的跨域来源，["*"] 表示允许所有来源

# ----------------------------------------------------------
# 认证配置
# ----------------------------------------------------------
auth:
  bcrypt_rounds: 12                      # bcrypt 哈希计算轮数（12 轮 ≈ 0.2s，安全与性能的合理折中）
