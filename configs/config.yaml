# ============================================================
# 项目配置文件
# ============================================================

# 数据库配置
database:
  url: "${DATABASE_URL}"
  echo: false
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600

# 向量库配置（PostgreSQL + pgvector/numpy）
vector_db:
  collection: "knowledge_base"

# LLM 配置
llm:
  api_key: "${LLM_API_KEY}"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen3.5-plus-2026-02-15"
  provider: "qwen"

# Embedding 配置
embedding:
  model: "BAAI/bge-m3"
  use_spark: true

# RAG 配置
rag:
  chunk_size: 500
  chunk_overlap: 50

# 文档存储配置
storage:
  cleanup:
    enabled: true               # 是否启用自动清理
    retention_days: 30          # 已索引文件保留天数
    orphan_retention_days: 7    # 孤儿文件（导入失败/中断）的保留天数

# JWT 配置
jwt:
  secret: "${JWT_SECRET}"
  algorithm: "HS256"
  expire_hours: 24
